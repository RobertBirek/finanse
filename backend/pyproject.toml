[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-advisor-backend"
version = "0.3.0"
description = "Personal Advisor — osobisty system operacyjny do zarządzania czasem, pieniędzmi, projektami i decyzjami"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.1,<0.157",
    "starlette>=1.9.0,<2",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.14.1,<3",
    "pydantic-settings>=2.3.0",
    "passlib[argon2]>=1.7.4",
    "bcrypt==4.0.1",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "certifi>=2026.10.19",
    "Mako>=1.4.3",
    "openai>=1.30.0",
    "python-multipart==0.0.32",
    "Pillow>=11.3.0,<13.0.0",
    "pypdf>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "httpx>=0.27.0",
    "types-passlib>=1.7.7.20240819",
]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a PostgreSQL test database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
python_version = "3.12"
