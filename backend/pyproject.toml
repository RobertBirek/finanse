[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-advisor-backend"
version = "0.3.0"
description = "Personal Advisor — osobisty system operacyjny do zarządzania czasem, pieniędzmi, projektami i decyzjami"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "bcrypt==4.0.1",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "openai>=1.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "types-python-jose>=3.3.4.20240106",
    "types-passlib>=1.7.7.20240819",
]

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring a PostgreSQL test database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
python_version = "3.12"
