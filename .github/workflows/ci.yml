# CI workflow for pull requests and pushes to main.
# It uses ephemeral test services and does not deploy to production.
name: PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_static:
    name: Backend static checks and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://synthetic:synthetic@127.0.0.1:9/no_db_collection
      DATABASE_URL: postgresql+asyncpg://synthetic:synthetic@127.0.0.1:9/no_db_collection
      REDIS_URL: redis://127.0.0.1:9/0
      ENVIRONMENT: test
      SECRET_KEY: synthetic-ci-collection
      OPENAI_API_KEY: ""
      LLM_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt ruff==0.17.1 mypy==2.4.0
        timeout-minutes: 3
      - run: python -m pip check
      - run: ruff check app tests ci_tools
      - run: mypy app ci_tools
      - name: Collect current checkout without running fixtures
        timeout-minutes: 1
        run: |
          # Create netns with sudo, then drop privileges before running checkout code.
          # No user namespace: hosted kernels can reject writes to uid_map.
          sudo -- unshare --net -- \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --no-new-privs -- \
            env -i PATH="$PATH" HOME="$HOME" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
              ENVIRONMENT="$ENVIRONMENT" TEST_DATABASE_URL="$TEST_DATABASE_URL" \
              DATABASE_URL="$DATABASE_URL" REDIS_URL="$REDIS_URL" SECRET_KEY="$SECRET_KEY" \
              OPENAI_API_KEY="$OPENAI_API_KEY" LLM_API_KEY="$LLM_API_KEY" \
              PYTHONDONTWRITEBYTECODE="$PYTHONDONTWRITEBYTECODE" \
            "$(command -v python)" -B -m ci_tools.runner collect \
              --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/ci-manifest/manifest.json" \
              --timeout-seconds 40
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: backend-manifest
          path: ${{ runner.temp }}/ci-manifest/
          if-no-files-found: error
          retention-days: 7

  backend_tests:
    name: Backend tests (${{ matrix.group }})
    needs: backend_static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [ordinary-1, ordinary-2, ordinary-3, ordinary-4, ordinary-5, ordinary-6, legacy, proxy]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Test-only role; each job creates its own ephemeral cluster.
          POSTGRES_USER: bank_import_task_c1
          POSTGRES_PASSWORD: synthetic-ci
          POSTGRES_DB: finanse_test
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bank_import_task_c1 -d finanse_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://bank_import_task_c1:synthetic-ci@127.0.0.1:5432/finanse_test
      DATABASE_URL: postgresql+asyncpg://bank_import_task_c1:synthetic-ci@127.0.0.1:5432/finanse_test
      BANK_IMPORT_MIGRATION_DATABASE_URL: postgresql+asyncpg://bank_import_task_c1:synthetic-ci@127.0.0.1:5432/finanse_test
      BANK_IMPORT_MIGRATIONS_ALLOWED: owned_no_port_runner
      ADVISOR_TEST_DB_GROUP: ${{ matrix.group }}
      ENVIRONMENT: test
      SECRET_KEY: synthetic-ci-tests
      OPENAI_API_KEY: ""
      LLM_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Start preparation budget
        working-directory: ${{ runner.temp }}
        run: echo "CI_PREP_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
        timeout-minutes: 3
      - uses: actions/download-artifact@v4
        timeout-minutes: 1
        with:
          name: backend-manifest
          path: ${{ runner.temp }}/ci-manifest
      - name: Prepare local proxy test images
        if: matrix.group == 'proxy'
        timeout-minutes: 2
        run: |
          docker pull nginx:alpine
          docker pull python:3.12-alpine
          docker image inspect nginx:alpine python:3.12-alpine > /dev/null
      - name: Preparation and owned PostgreSQL preflight
        timeout-minutes: 1
        run: |
          test "$(( $(date +%s) - CI_PREP_STARTED ))" -le 300
          export ADVISOR_TEST_DB_COMMIT="$(git rev-parse HEAD)"
          permit_dir="$(mktemp -d "$RUNNER_TEMP/advisor-test-db.XXXXXXXX")"
          export ADVISOR_TEST_DB_PERMIT="$permit_dir/permit.json"
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import asyncpg
          from tests.database_safety import issue_ci_permit
          async def check():
              url = os.environ['TEST_DATABASE_URL'].replace('postgresql+asyncpg:', 'postgresql:', 1)
              connection = await asyncpg.connect(url, timeout=5)
              assert await connection.fetchval("SELECT current_user") == "bank_import_task_c1"
              assert await connection.fetchval("SELECT current_database()") == "finanse_test"
              assert await connection.fetchval("SELECT count(*) FROM pg_tables WHERE schemaname='public'") == 0
              await connection.close()
              await issue_ci_permit(
                  os.environ['TEST_DATABASE_URL'],
                  Path(os.environ['ADVISOR_TEST_DB_PERMIT']),
                  os.environ,
              )
          asyncio.run(check())
          PY
          echo "ADVISOR_TEST_DB_PERMIT=$ADVISOR_TEST_DB_PERMIT" >> "$GITHUB_ENV"
          echo "ADVISOR_TEST_DB_COMMIT=$ADVISOR_TEST_DB_COMMIT" >> "$GITHUB_ENV"
      - name: Run one serial group with bounded teardown
        timeout-minutes: 13
        run: |
          python -B -m ci_tools.runner run \
            --manifest "$RUNNER_TEMP/ci-manifest/manifest.json" \
            --group "${{ matrix.group }}" \
            --output "$RUNNER_TEMP/backend-artifacts/${{ matrix.group }}" \
            --timeout-seconds 720
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: backend-result-${{ matrix.group }}
          path: ${{ runner.temp }}/backend-artifacts/
          if-no-files-found: error
          retention-days: 7

  backend:
    # Preserve the existing required check name and job ID.
    name: Backend tests and static checks
    needs: [backend_static, backend_tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: backend-manifest
          path: ${{ runner.temp }}/ci-manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-result-*
          merge-multiple: true
          path: ${{ runner.temp }}/backend-results
      - name: Reject missing jobs, phases, reports and skipped tests
        working-directory: backend
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$CI_NEEDS" > "$RUNNER_TEMP/needs.json"
          python -B -m ci_tools.runner verify \
            --manifest "$RUNNER_TEMP/ci-manifest/manifest.json" \
            --results "$RUNNER_TEMP/backend-results" --needs "$RUNNER_TEMP/needs.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-gate-inputs
          path: ${{ runner.temp }}/needs.json
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend tests build and browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Warsaw
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  release_images:
    name: Accept the production images
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - run: python3 -B -m unittest discover -s ops/one-command -p test_release.py
      - run: bash ops/one-command/build-and-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: finanse-release-${{ github.sha }}
          path: ${{ runner.temp }}/finanse-release-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
