# Candidate overlay ONLY. Apply after staging, ownership and image compatibility checks.
# Must be last, after base + production + immutable release files. Never deploy alone.
services:
  backend:
    user: "${ADVISOR_UID:?Set verified non-root application UID}:${ADVISOR_GID:?Set application GID}"
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 128
    read_only: true
    privileged: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: !reset []
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
  worker:
    user: "${ADVISOR_UID:?Set verified non-root application UID}:${ADVISOR_GID:?Set application GID}"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    read_only: true
    privileged: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: !reset []
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
  stirling-pdf:
    user: "${STIRLING_UID:?Set UID verified for pinned Stirling image}:${STIRLING_GID:?Set Stirling GID}"
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    read_only: true
    privileged: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: !reset []
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
